[package]
name = "transpiler"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["staticlib"]
name = "hao_transpiler"

[profile.release]
panic = "abort"

[[bin]]
name = "transpiler"
path = "src/main.rs"

[dependencies]
oxc_allocator = "0.116"
oxc_parser = "0.116"
oxc_span = "0.116"
oxc_codegen = "0.116"
oxc_diagnostics = "0.116"
oxc_ast = "0.116"
oxc_transformer = "0.116"
oxc_semantic = "0.116"
oxc_sourcemap = "6.0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

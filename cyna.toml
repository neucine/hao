name = "hao-cyna"
version = "0.1.2"
src = "src"
type = "exe"
entry = "src/main.cy"

[c]
sources = ["src/bridge/bridge.c", "src/bridge/errors.c", "src/bridge/module.c", "src/bridge/runtime_allocator.c", "src/bridge/global/console.c", "src/bridge/global/timer.c", "src/bridge/std/fs/native.c", "src/bridge/std/process/native.c", "src/bridge/std/process/execute.c", "src/bridge/std/http/native.c", "src/bridge/std/http/server_uv.c", "src/bridge/process_memory.c", "src/bridge/telemetry/metrics.c", "src/bridge/telemetry/interface.c", "src/bridge/std/ffi/native.c", "src/bridge/js/addon.c", "src/bridge/jupyter/zmq.c"]
include_paths = [".deps/install/include", "/opt/homebrew/include"]

[link]
libs = ["quickjs", "uv", "hao_transpiler", "curl", "ffi", "zmq", "crypto"]
search_paths = [".deps/install/lib", "libs/transpiler/target/release", "/opt/homebrew/lib"]

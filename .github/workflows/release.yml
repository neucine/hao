name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_os: linux
          - os: macos-latest
            artifact_os: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          zig_version=$(sed -n 's/.*\.version = "\([^"]*\)".*/\1/p' build.zig.zon | head -n 1)
          runtime_version=$(sed -n 's/.*pub const string = "\([^"]*\)".*/\1/p' src/version.zig)
          test "$version" = "$zig_version"
          test "$version" = "$runtime_version"

      - name: Build release
        run: zig build -Doptimize=ReleaseSafe

      - name: Package release
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          ARTIFACT_OS: ${{ matrix.artifact_os }}
        run: |
          version="${RELEASE_TAG#v}"
          package="hao-${version}-${ARTIFACT_OS}-$(uname -m)"
          mkdir -p "dist/${package}/include" "dist/${package}/docs"
          cp zig-out/bin/hao "dist/${package}/hao"
          cp zig-out/include/*.h "dist/${package}/include/"
          cp README.md "dist/${package}/"
          cp docs/addons.md docs/embedding.md docs/telemetry.md "dist/${package}/docs/"
          tar -C dist -czf "dist/${package}.tar.gz" "${package}"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: hao-${{ matrix.artifact_os }}
          path: dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: hao-*
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" dist/*.tar.gz --verify-tag --generate-notes --title "Hao JS ${RELEASE_TAG}"

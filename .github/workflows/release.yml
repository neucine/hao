name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  binary:
    name: ${{ matrix.artifact_os }} distribution
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_os: linux
          - os: macos-latest
            artifact_os: macos

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout shared Zig libraries
        uses: actions/checkout@v4
        with:
          repository: neucine/zig-libs
          ref: 240f9b223b35ef8000201f260856e04492766fa0
          path: zig-libs

      - name: Setup Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          version="${RELEASE_TAG#v}"
          zig_version=$(sed -n 's/.*\.version = "\([^"]*\)".*/\1/p' build.zig.zon | head -n 1)
          runtime_version=$(sed -n 's/.*pub const string = "\([^"]*\)".*/\1/p' src/version.zig)
          test "$version" = "$zig_version"
          test "$version" = "$runtime_version"

      - name: Build release
        run: zig build -Doptimize=ReleaseSafe

      - name: Package release distribution
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          ARTIFACT_OS: ${{ matrix.artifact_os }}
        run: |
          set -euo pipefail

          checksum() {
            if command -v sha256sum >/dev/null 2>&1; then
              sha256sum "$1"
            else
              shasum -a 256 "$1"
            fi
          }

          version="${RELEASE_TAG#v}"
          package="hao-${version}-${ARTIFACT_OS}-$(uname -m)"
          source_paths=(build.zig build.zig.zon include src libs/transpiler)

          mkdir -p dist package-source verify-source
          git archive --format=tar --prefix="${package}/" "$GITHUB_SHA" -- "${source_paths[@]}" | tar -C verify-source -xf -
          zig build --build-file "verify-source/${package}/build.zig" -Doptimize=ReleaseSafe

          git archive --format=tar --prefix="${package}/" "$GITHUB_SHA" -- "${source_paths[@]}" | tar -C package-source -xf -
          tar -C package-source -czf "dist/${package}.tar.gz" "${package}"
          checksum "dist/${package}.tar.gz" > "dist/${package}.tar.gz.sha256"

          cp zig-out/bin/hao "dist/${package}"
          checksum "dist/${package}" > "dist/${package}.sha256"

      - name: Upload release archive
        uses: actions/upload-artifact@v4
        with:
          name: hao-${{ matrix.artifact_os }}
          path: dist/hao-*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: [binary]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout shared Zig libraries
        uses: actions/checkout@v4
        with:
          repository: neucine/zig-libs
          ref: 240f9b223b35ef8000201f260856e04492766fa0
          path: zig-libs

      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          pattern: hao-*
          merge-multiple: true

      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* --verify-tag --generate-notes --title "Hao JS ${RELEASE_TAG}"
          fi

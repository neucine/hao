name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  source-checks:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Check public TypeScript types
        run: |
          bun x tsc@5.5.4 -p tsconfig.json --pretty false
          bun x tsc@5.5.4 -p test/types/tsconfig.json --pretty false
      - name: Check C headers and addon example
        run: |
          cc -Iinclude -c examples/native-addon/native.c -o /tmp/hao-addon-example.o
          printf '#include "addon.h"\nint main(void) { return JS_ADDON_ABI_VERSION == 1 ? 0 : 1; }\n' | cc -Iinclude -x c -c -o /tmp/hao-addon-header.o -
          printf '#include "hao.h"\nint main(void) { return HAO_EMBED_ABI_VERSION == 2 ? 0 : 1; }\n' | cc -Iinclude -x c -c -o /tmp/hao-embed-header.o -
      - name: Check build scripts
        run: |
          sh -n cyna/build.sh
          sh -n cyna/build_deps.sh
          sh -n cyna/test/smoke.sh

name = "hao-cyna"
version = "0.1.2"
src = "src"
type = "exe"
entry = "src/main.cy"

[c]
sources = ["bridge.c", "src/async/uv.c", "src/errors.c", "src/module.c", "src/global/console.c", "src/global/timer.c", "src/std/fs/native.c", "src/std/process/native.c", "src/std/process/execute.c", "src/std/http/native.c", "src/std/http/server_uv.c", "src/process_memory.c", "src/telemetry/metrics.c", "src/std/ffi/native.c", "src/js/addon.c", "src/jupyter/zmq.c"]
include_paths = [".deps/install/include", "/opt/homebrew/include"]

[link]
libs = ["quickjs", "uv", "hao_transpiler", "curl", "ffi", "zmq", "crypto"]
search_paths = [".deps/install/lib", "../libs/transpiler/target/release", "/opt/homebrew/lib"]
